<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palette Preview</title>
<link rel="stylesheet" href="src/styles/palettes.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #E9E9EB;
    color: #1C1C1F;
  }
  .page-head {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 24px;
    background: #F4F4F5; border-bottom: 1px solid #D4D4D8;
  }
  .page-head h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .toggle {
    font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px;
    border: 1px solid #A1A1AA; background: #FAFAFA; color: #18181B; cursor: pointer;
  }
  .toggle:focus-visible { outline: 2px solid #18181B; outline-offset: 2px; }
  main { display: grid; gap: 24px; padding: 24px; max-width: 1200px; margin: 0 auto; }

  /* Palette section: everything below uses only palette tokens. */
  .palette {
    background: var(--color-bg); color: var(--color-text);
    border: 1px solid var(--color-border); border-radius: 16px;
    padding: 28px; display: grid; gap: 22px;
  }
  .palette-head h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
  .palette-head p { margin: 0; color: var(--color-text-muted); font-size: 14px; }
  .palette-head code { font-size: 12px; color: var(--color-text-muted); }

  .body { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 860px) { .body { grid-template-columns: 1fr; } }

  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .swatch {
    border: 1px solid var(--color-border); border-radius: 10px; overflow: hidden;
    background: var(--color-surface);
  }
  .swatch .chip { height: 48px; border-bottom: 1px solid var(--color-border); }
  .swatch .meta { padding: 6px 8px; display: grid; gap: 1px; }
  .swatch .name { font-size: 11.5px; font-weight: 600; }
  .swatch .hex { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--color-text-muted); }

  .card {
    background: var(--color-surface-raised); border: 1px solid var(--color-border);
    border-radius: 14px; padding: 22px; display: grid; gap: 14px;
    box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 8px 24px rgb(0 0 0 / .06);
  }
  .card h3 { margin: 0; font-size: 18px; }
  .card p { margin: 0; }
  .caption { color: var(--color-text-muted); font-size: 13px; }
  .card a { color: var(--color-accent); text-underline-offset: 3px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .btn {
    font: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px;
    border-radius: 9px; cursor: pointer; border: 1px solid transparent;
  }
  .btn-primary { background: var(--color-accent); color: var(--color-on-accent); }
  .btn-primary:hover { background: var(--color-accent-hover); }
  .btn-outline { background: transparent; color: var(--color-accent); border-color: var(--color-accent); }
  .btn-outline:hover { background: var(--color-surface); }
  .btn:focus-visible, .field input:focus-visible, .field input.is-focused {
    outline: 2px solid var(--color-focus-ring); outline-offset: 2px;
  }

  .field { display: grid; gap: 5px; font-size: 13px; }
  .field input {
    font: inherit; font-size: 14px; padding: 9px 11px; border-radius: 9px;
    background: var(--color-surface); color: var(--color-text);
    border: 1px solid var(--color-border);
  }
  .field input::placeholder { color: var(--color-text-muted); }
  .field input.is-focused, .field input:focus { border-color: var(--color-focus-ring); }

  .badge {
    font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    background: var(--color-surface); border: 1px solid currentColor;
  }
  .badge.success { color: var(--color-success); }
  .badge.warning { color: var(--color-warning); }
  .badge.danger { color: var(--color-danger); }
</style>
</head>
<body>
<header class="page-head">
  <h1>Palette Preview: 5 palettes, light and dark</h1>
  <button class="toggle" id="toggle" type="button" aria-pressed="false">Switch to dark</button>
</header>
<main id="palettes"></main>

<script>
  const TOKENS = ['bg', 'surface', 'surface-raised', 'border', 'text', 'text-muted',
    'accent', 'accent-hover', 'on-accent', 'focus-ring', 'success', 'warning', 'danger'];
  const PALETTES = [
    ['champagne', 'Champagne', 'Warm ivory with a champagne-gold accent. Hospitality, jewelry, boutique e-commerce.'],
    ['admiralty', 'Admiralty', 'Deep navy and soft ivory with brass. Finance, legal, premium B2B.'],
    ['evergreen', 'Evergreen', 'Forest green on bone neutrals. Wellness, sustainability, outdoor brands.'],
    ['terracotta', 'Terracotta', 'Charcoal and warm off-white with fired clay. Architecture, ceramics, editorial.'],
    ['sapphire', 'Sapphire', 'Near-monochrome cool grey with sapphire. SaaS, developer tools, fintech.'],
  ];

  const main = document.getElementById('palettes');
  for (const [key, name, mood] of PALETTES) {
    const s = document.createElement('section');
    s.className = 'palette';
    s.dataset.palette = key;
    s.dataset.theme = 'light';
    s.innerHTML = `
      <div class="palette-head">
        <h2>${name}</h2>
        <p>${mood}</p>
        <code>data-palette="${key}"</code>
      </div>
      <div class="body">
        <div class="swatches">
          ${TOKENS.map(t => `
            <div class="swatch">
              <div class="chip" style="background: var(--color-${t})"></div>
              <div class="meta"><span class="name">${t}</span><span class="hex" data-token="${t}"></span></div>
            </div>`).join('')}
        </div>
        <div class="card">
          <h3>Quarterly membership review</h3>
          <p>Your plan renews on 1 December. Review usage, invite teammates, or <a href="#">compare plans</a> before then.</p>
          <p class="caption">Last updated 4 minutes ago · Billing contact: finance team</p>
          <div class="row">
            <button class="btn btn-primary" type="button">Renew plan</button>
            <button class="btn btn-outline" type="button">View invoice</button>
          </div>
          <label class="field">Work email
            <input type="email" placeholder="name@company.com">
          </label>
          <label class="field">Company (focus state)
            <input type="text" class="is-focused" value="Northwind Studio">
          </label>
          <div class="row">
            <span class="badge success">Active</span>
            <span class="badge warning">Renews soon</span>
            <span class="badge danger">Payment failed</span>
          </div>
        </div>
      </div>`;
    main.appendChild(s);
  }

  function fillHex() {
    for (const s of document.querySelectorAll('.palette')) {
      const cs = getComputedStyle(s);
      for (const el of s.querySelectorAll('.hex')) {
        el.textContent = cs.getPropertyValue('--color-' + el.dataset.token).trim() || '(missing)';
      }
    }
  }

  const toggle = document.getElementById('toggle');
  let theme = 'light';
  function setTheme(t) {
    theme = t;
    document.querySelectorAll('.palette').forEach(s => { s.dataset.theme = t; });
    toggle.textContent = t === 'light' ? 'Switch to dark' : 'Switch to light';
    toggle.setAttribute('aria-pressed', String(t === 'dark'));
    fillHex();
  }
  toggle.addEventListener('click', () => setTheme(theme === 'light' ? 'dark' : 'light'));
  const initial = new URLSearchParams(location.search).get('theme');
  setTheme(initial === 'dark' ? 'dark' : 'light');
</script>
</body>
</html>
